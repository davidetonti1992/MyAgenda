<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>MyAgenda</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#fbf7ee;--ink:#222;--muted:#777;--line:#ddd3c2;--accent:#6d5d4b;--note:#fff2a8}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eee8dc;color:var(--ink)}
.app{max-width:900px;margin:auto;min-height:100vh;background:var(--paper);padding:14px}
header{display:grid;grid-template-columns:38px 1fr 38px 38px 38px;align-items:center;gap:4px;background:#fbf7ee;padding:8px 2px 12px}
button{font:inherit}.nav,.add,.settings{border:0;background:transparent;border-radius:50%;height:38px;width:38px;font-size:24px;color:#3d3934}.nav:active,.add:active,.settings:active{background:#eee6da}.month{border:0;background:transparent;text-align:center;min-width:0;white-space:nowrap;font-size:20px;font-weight:700;color:#292724;padding:5px 8px;text-transform:none}.month .year{font-size:15px;font-weight:400;color:#777;margin-left:5px}
.calendar{display:block;height:48vh;min-height:300px;max-height:470px;overflow-y:auto;scroll-behavior:smooth;padding-right:3px;scrollbar-width:thin;scrollbar-color:#c8bba8 transparent}.col{min-width:0}.day{border-top:1px solid var(--line);min-height:46px;padding:7px 8px;border-radius:8px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}.dayhead{flex:0 0 68px;margin-bottom:0}.event{flex:0 1 auto}.day.sunday{background:#f8e7e3}.day.today{background:#e3f4fc!important;box-shadow:inset 4px 0 0 #67add1!important}.day.today .dayhead{color:#347b9f}.dayhead{font-weight:700;font-size:13px;margin-bottom:4px}.dow{color:var(--muted);display:inline-block;width:34px}.event{font-size:15px;line-height:1.35;padding:2px 0;white-space:normal;font-weight:500}.event .sym{display:inline-block;width:22px}.event .time{font-variant-numeric:tabular-nums;font-weight:650}
.postit{margin-top:16px;background:var(--note);border-radius:8px;padding:14px;box-shadow:0 3px 10px #0002;transform:rotate(-.2deg)}
.postit-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.postit h3{margin:0 0 8px;font-size:15px}.note-tools{display:flex;gap:5px;margin-bottom:6px}.note-tool{border:0;background:#fff6;border-radius:8px;width:31px;height:29px;font-size:17px}.note-list{display:flex;flex-direction:column}.note-row{display:grid;grid-template-columns:18px 1fr 30px 30px;align-items:center;min-height:34px;border-bottom:1px solid #cbbf78}.bullet{font-size:18px;text-align:center}.note-input{border:0;outline:0;background:transparent;font:15px system-ui;min-width:0;padding:6px 4px}.check{border:1px solid #aaa;background:#fff8;border-radius:50%;width:23px;height:23px;padding:0;font-size:15px}.note-row.done .check{background:#58a85b;color:white;border-color:#58a85b}.note-row.done .note-input{opacity:.6;text-decoration:line-through}
dialog{border:0;border-radius:18px;width:min(94vw,520px);padding:18px;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0006}
label{display:block;font-size:13px;font-weight:700;margin-top:12px}.field{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}.dsel{border:1px solid #ccc;background:white;border-radius:8px;padding:8px 0}.dsel.on{background:#d9cbb8;border-color:#7c6a55}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.primary{background:#5f5142;color:#fff;border:0;border-radius:10px;padding:10px 16px}.secondary{background:#eee;border:0;border-radius:10px;padding:10px 16px}
.cats{display:flex;gap:6px;align-items:end}.cats select{flex:1}.tiny{padding:10px;border:0;border-radius:10px;background:#eee}
.hint{font-size:12px;color:#777;margin-top:6px}
@media(max-width:520px){header{grid-template-columns:36px 1fr 36px 36px 36px!important}.settings{grid-column:auto!important}.app{padding:9px}.calendar{height:46vh;min-height:285px}.day{min-height:44px;padding:6px 6px;gap:8px}.dayhead{flex-basis:64px}.event{font-size:14px}.dayhead{font-size:12px}.dow{width:30px}.month{font-size:18px}header{grid-template-columns:36px minmax(0,1fr) 36px 36px 36px!important;gap:3px!important}}
</style>
</head>
<body>
<div class="app">
<header><button class="nav" id="prev">‹</button><button class="month" id="monthTitle"></button><button class="nav" id="next">›</button><button class="add" id="add">＋</button><button class="settings" id="settings">⚙</button></header>
<main class="calendar" id="calendar"></main>
<section class="postit"><div class="postit-head"><h3 id="noteTitle">📝 APPUNTI</h3><div class="note-pages"><button class="note-tool" id="notePrev">‹</button><span id="notePageLabel">Pagina 1</span><button class="note-tool" id="noteNext">›</button></div></div><div class="note-list" id="noteList"></div></section>
<button id="shoppingBtn" style="width:100%;margin:10px 0 4px;border:0;border-radius:14px;padding:12px;background:#f2eadc;font-size:16px;font-weight:700">🛒 Lista della spesa</button>
</div>

<dialog id="eventDlg">
<h2 style="margin-top:0">Nuovo appuntamento</h2>
<label>Titolo</label><input id="title" class="field" placeholder="es. Revisioni">
<label>Categoria</label><select id="cat" class="field"></select>
<label>Data</label><input type="date" id="eventDate" class="field">
<label><input type="checkbox" id="repeatEvent"> Ripeti appuntamento</label>
<div id="repeatBox" style="display:none"><div class="hint">Seleziona gli altri giorni del mese</div><div class="days" id="dayPicker"></div></div>
<label><input type="checkbox" id="hasTime"> Con orario</label>
<div class="row" id="timeRow" style="display:none"><div><label>Da</label><input type="time" id="start" class="field"></div><div><label>A (facoltativa)</label><input type="time" id="end" class="field"></div></div>

<div class="actions"><button class="secondary" id="cancel">Annulla</button><button class="primary" id="save">Salva</button></div>
</dialog>
<dialog id="dayDlg"><h2 id="dayDlgTitle" style="margin-top:0"></h2><div id="dayEvents"></div><div class="actions"><button class="secondary" id="dayClose">Chiudi</button><button class="primary" id="dayAdd">＋ Nuovo</button></div></dialog>
<dialog id="shoppingDlg"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">🛒 Lista della spesa</h2><button class="secondary" id="shoppingClear">Elimina tutto</button></div><div id="shoppingList" style="margin-top:12px"></div><div class="actions"><button class="secondary" id="shoppingClose">Chiudi</button></div></dialog>
<dialog id="settingsDlg"><h2 style="margin-top:0">⚙️ Impostazioni</h2><h3>Categorie</h3><div id="catList"></div><div class="actions"><button class="secondary" id="settingsClose">Chiudi</button><button class="primary" id="catAdd">＋ Nuova categoria</button></div></dialog>
<dialog id="monthDlg">
<h2>Scegli mese</h2><div class="row"><select id="mSel" class="field"></select><input id="ySel" type="number" class="field" min="1970" max="2100"></div>
<div class="actions"><button class="secondary" id="mCancel">Annulla</button><button class="primary" id="mOk">Vai</button></div>
</dialog>

<script>
const M=['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const D=['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
let view=new Date(); view=new Date(view.getFullYear(),view.getMonth(),1);
let db=JSON.parse(localStorage.getItem('myagenda-db')||'{"events":[],"categories":[{"name":"Lavoro","symbol":"💼"},{"name":"Allenamento","symbol":"🏋️"},{"name":"Casa","symbol":"🏠"},{"name":"Altro","symbol":"📌"}],"notes":{}}');
const $=id=>document.getElementById(id); const persist=()=>localStorage.setItem('myagenda-db',JSON.stringify(db));
function key(){return `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`}
function daysIn(){return new Date(view.getFullYear(),view.getMonth()+1,0).getDate()}
function render(){
 $('monthTitle').innerHTML=`${M[view.getMonth()].charAt(0)}${M[view.getMonth()].slice(1).toLowerCase()} <span class="year">${view.getFullYear()}</span>`; $('noteTitle').textContent=`📝 APPUNTI · ${M[view.getMonth()]}`;
 $('calendar').innerHTML='';
 let n=daysIn(), today=new Date(), currentMonth=today.getFullYear()===view.getFullYear()&&today.getMonth()===view.getMonth();
 for(let d=1;d<=n;d++){let date=new Date(view.getFullYear(),view.getMonth(),d);let box=document.createElement('div');box.className='day';
 if(date.getDay()===0)box.classList.add('sunday');if(currentMonth&&d===today.getDate()){box.classList.add('today');box.id='todayRow'}let h=document.createElement('div');h.className='dayhead';h.innerHTML=`<span class="dow">${D[date.getDay()]}</span> ${d}`; box.append(h);
 let iso=`${key()}-${String(d).padStart(2,'0')}`;
 let ev=db.events.filter(e=>e.date===iso).sort((a,b)=>{if(!a.start&&!b.start)return a.created-b.created;if(!a.start)return -1;if(!b.start)return 1;return a.start.localeCompare(b.start)||a.created-b.created});
 ev.forEach(e=>{let c=db.categories[e.cat]||{symbol:'📌'};let p=document.createElement('div');p.className='event';
 let tm=e.start?`<span class="time">${e.start}${e.end?'–'+e.end:''}</span> `:'';p.innerHTML=`<span class="sym">${c.symbol}</span>${tm}${escapeHtml(e.title)}`;box.append(p)});
 box.onclick=()=>openDay(d); $('calendar').append(box)}
 renderNotes();
 requestAnimationFrame(()=>{if(currentMonth){let el=$('todayRow');if(el)$('calendar').scrollTop=el.offsetTop-$('calendar').offsetTop}})
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fillCats(){ $('cat').innerHTML=db.categories.map((c,i)=>`<option value="${i}">${c.symbol} ${escapeHtml(c.name)}</option>`).join('')}
function buildDays(selected=[]){$('dayPicker').innerHTML='';for(let d=1;d<=daysIn();d++){let b=document.createElement('button');b.className='dsel'+(selected.includes(d)?' on':'');b.textContent=d;b.dataset.d=d;b.onclick=e=>{e.preventDefault();b.classList.toggle('on')};$('dayPicker').append(b)}}
let editId=null,activeDay=null;
function openEvent(day,id=null){editId=id;fillCats();let e=id?db.events.find(x=>x.id===id):null;let base=e?e.date:`${key()}-${String(day||new Date().getDate()).padStart(2,'0')}`;$('eventDate').value=base;$('title').value=e?e.title:'';$('cat').value=e?e.cat:0;$('hasTime').checked=!!(e&&e.start);$('timeRow').style.display=e&&e.start?'grid':'none';$('start').value=e?e.start||'':'';$('end').value=e?e.end||'':'';$('repeatEvent').checked=false;$('repeatBox').style.display='none';buildDays([]);$('eventDlg').querySelector('h2').textContent=e?'Modifica appuntamento':'Nuovo appuntamento';$('eventDlg').showModal()}
function openDay(d){activeDay=d;let date=new Date(view.getFullYear(),view.getMonth(),d),iso=`${key()}-${String(d).padStart(2,'0')}`;$('dayDlgTitle').textContent=`${D[date.getDay()]} ${d} ${M[view.getMonth()]}`;let host=$('dayEvents');host.innerHTML='';let ev=db.events.filter(e=>e.date===iso);if(!ev.length)host.innerHTML='<p class="hint">Nessun appuntamento.</p>';ev.forEach(e=>{let cat=db.categories[e.cat]||{symbol:'📌'},r=document.createElement('div');r.style.cssText='display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd';let info=document.createElement('div');info.innerHTML=`<b>${cat.symbol} ${escapeHtml(e.title)}</b><div class="hint">${e.start?(e.start+(e.end?' – '+e.end:'')):'Senza orario'}</div>`;let ed=document.createElement('button');ed.className='tiny';ed.textContent='✏️';ed.onclick=()=>{$('dayDlg').close();openEvent(d,e.id)};let del=document.createElement('button');del.className='tiny';del.textContent='🗑️';del.onclick=()=>{if(confirm('Eliminare questo appuntamento?')){db.events=db.events.filter(x=>x.id!==e.id);persist();$('dayDlg').close();render()}};r.append(info,ed,del);host.append(r)});$('dayDlg').showModal()}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('add').onclick=()=>openEvent();$('repeatEvent').onchange=()=>{$('repeatBox').style.display=$('repeatEvent').checked?'block':'none';if($('repeatEvent').checked){let dt=$('eventDate').value;if(dt){view=new Date(+dt.slice(0,4),+dt.slice(5,7)-1,1)}buildDays([])}};$('eventDate').onchange=()=>{if($('repeatEvent').checked){let dt=$('eventDate').value;view=new Date(+dt.slice(0,4),+dt.slice(5,7)-1,1);buildDays([])}};$('dayClose').onclick=()=>$('dayDlg').close();$('dayAdd').onclick=()=>{$('dayDlg').close();openEvent(activeDay)}; $('hasTime').onchange=()=> $('timeRow').style.display=$('hasTime').checked?'grid':'none';
$('cancel').onclick=()=>$('eventDlg').close();
$('save').onclick=()=>{let t=$('title').value.trim(),date=$('eventDate').value;if(!t||!date){alert('Inserisci titolo e data.');return}let vals={title:t,cat:+$('cat').value,start:$('hasTime').checked?$('start').value:'',end:$('hasTime').checked?$('end').value:''};if(editId){let e=db.events.find(x=>x.id===editId);if(e)Object.assign(e,vals,{date});editId=null}else{let gid=Date.now().toString(36),created=Date.now();db.events.push({id:gid+'-0',group:gid,date,created,...vals});if($('repeatEvent').checked){let y=+date.slice(0,4),m=+date.slice(5,7);[...document.querySelectorAll('.dsel.on')].map(x=>+x.dataset.d).forEach((d,i)=>{let dt=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(dt!==date)db.events.push({id:gid+'-'+d,group:gid,date:dt,created:created+i+1,...vals})})}}persist();$('eventDlg').close();render()};
let notePage=0;
function getNotes(){let v=db.notes[key()];if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim())return v.split(/\n+/).filter(Boolean).map(text=>({text,done:false}));return []}
function ensureNoteSlots(notes){if(!notes.length)notes.push({text:'',done:false});while(notes.length<4)notes.push({text:'',done:false});let lastPage=notes.slice(Math.floor((notes.length-1)/4)*4);if(lastPage.length===4&&lastPage.every(n=>n.text&&n.done))notes.push({text:'',done:false});return notes}
function renderNotes(){let list=$('noteList'),notes=ensureNoteSlots(getNotes());db.notes[key()]=notes;let pages=Math.max(1,Math.ceil(notes.length/4));if(notePage>=pages)notePage=pages-1;list.innerHTML='';$('notePageLabel').textContent='Pagina '+(notePage+1);$('notePrev').disabled=notePage===0;$('noteNext').disabled=notePage>=pages-1;let start=notePage*4;for(let i=start;i<start+4;i++){let item=notes[i]||{text:'',done:false};if(!notes[i])notes[i]=item;let row=document.createElement('div');row.className='note-row'+(item.done?' done':'');let bullet=document.createElement('span');bullet.className='bullet';bullet.textContent=item.text?'•':'';let input=document.createElement('input');input.className='note-input';input.placeholder=!item.text?'Scrivi qui...':'';input.value=item.text||'';let check=document.createElement('button');check.className='check';check.textContent=item.done?'✓':'';check.style.visibility=item.text?'visible':'hidden';let del=document.createElement('button');del.className='check';del.textContent='🗑️';del.style.visibility=item.text?'visible':'hidden';input.oninput=()=>{notes[i].text=input.value;bullet.textContent=input.value?'•':'';check.style.visibility=input.value?'visible':'hidden';del.style.visibility=input.value?'visible':'hidden';db.notes[key()]=notes;persist()};check.onclick=()=>{if(!notes[i].text)return;notes[i].done=!notes[i].done;ensureNoteSlots(notes);db.notes[key()]=notes;persist();renderNotes()};del.onclick=()=>{notes.splice(i,1);ensureNoteSlots(notes);db.notes[key()]=notes;persist();renderNotes()};row.append(bullet,input,check,del);list.append(row)}persist()}
$('notePrev').onclick=()=>{if(notePage>0){notePage--;renderNotes()}};$('noteNext').onclick=()=>{let pages=Math.ceil(getNotes().length/4);if(notePage<pages-1){notePage++;renderNotes()}};
function getShopping(){return Array.isArray(db.shopping)?db.shopping:[]}
function renderShopping(){let items=getShopping();if(!items.length)items.push({text:'',done:false});if(items[items.length-1].text)items.push({text:'',done:false});db.shopping=items;let host=$('shoppingList');host.innerHTML='';items.forEach((item,i)=>{let row=document.createElement('div');row.className='note-row'+(item.done?' done':'');let bullet=document.createElement('span');bullet.className='bullet';bullet.textContent=item.text?'•':'';let input=document.createElement('input');input.className='note-input';input.placeholder=!item.text?'Aggiungi prodotto...':'';input.value=item.text||'';let check=document.createElement('button');check.className='check';check.textContent=item.done?'✓':'';check.style.visibility=item.text?'visible':'hidden';let del=document.createElement('button');del.className='check';del.textContent='🗑️';del.style.visibility=item.text?'visible':'hidden';input.oninput=()=>{items[i].text=input.value;bullet.textContent=input.value?'•':'';check.style.visibility=input.value?'visible':'hidden';del.style.visibility=input.value?'visible':'hidden';db.shopping=items;persist()};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(input.value&&i===items.length-1){items.push({text:'',done:false});db.shopping=items;persist();renderShopping();setTimeout(()=>document.querySelectorAll('#shoppingList .note-input')[i+1]?.focus(),0)}}};check.onclick=()=>{if(!items[i].text)return;items[i].done=!items[i].done;db.shopping=items;persist();renderShopping()};del.onclick=()=>{items.splice(i,1);db.shopping=items;persist();renderShopping()};row.append(bullet,input,check,del);host.append(row)});persist()}
$('shoppingBtn').onclick=()=>{renderShopping();$('shoppingDlg').showModal()};$('shoppingClose').onclick=()=>$('shoppingDlg').close();$('shoppingClear').onclick=()=>{if(confirm('Eliminare tutta la lista della spesa?')){db.shopping=[];persist();renderShopping()}};
$('monthTitle').onclick=()=>{$('mSel').innerHTML=M.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('mSel').value=view.getMonth();$('ySel').value=view.getFullYear();$('monthDlg').showModal()};
$('mCancel').onclick=()=>$('monthDlg').close();$('mOk').onclick=()=>{view=new Date(+$('ySel').value,+$('mSel').value,1);$('monthDlg').close();render()};
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body></html>
