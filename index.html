<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>MyAgenda</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#fbf7ee;--ink:#222;--muted:#777;--line:#ddd3c2;--accent:#6d5d4b;--note:#fff2a8}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eee8dc;color:var(--ink)}
.app{max-width:900px;margin:auto;min-height:100vh;background:var(--paper);padding:14px}
header{display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;gap:8px;position:sticky;top:0;background:var(--paper);z-index:4;padding:6px 0 12px}
button{font:inherit}.nav,.add{border:0;background:#e9dfcf;border-radius:14px;height:44px;font-size:24px}.month{border:0;background:transparent;font-size:22px;font-weight:750}
.calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.col{min-width:0}.day{border-top:1px solid var(--line);min-height:58px;padding:5px 3px}.day.sunday{background:#f8e7e3;border-radius:7px}.dayhead{font-weight:700;font-size:13px;margin-bottom:4px}.dow{color:var(--muted);display:inline-block;width:34px}.event{font-size:13px;line-height:1.35;padding:2px 0;white-space:normal}.event .sym{display:inline-block;width:22px}.event .time{font-variant-numeric:tabular-nums;font-weight:650}
.postit{margin-top:16px;background:var(--note);border-radius:8px;padding:14px;box-shadow:0 3px 10px #0002;transform:rotate(-.2deg)}
.postit-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.postit h3{margin:0 0 8px;font-size:15px}.note-tools{display:flex;gap:5px;margin-bottom:6px}.note-tool{border:0;background:#fff6;border-radius:8px;width:31px;height:29px;font-size:17px}.note-list{display:flex;flex-direction:column}.note-row{display:grid;grid-template-columns:18px 1fr 30px;align-items:center;min-height:34px;border-bottom:1px solid #cbbf78}.bullet{font-size:18px;text-align:center}.note-input{border:0;outline:0;background:transparent;font:15px system-ui;min-width:0;padding:6px 4px}.check{border:1px solid #aaa;background:#fff8;border-radius:50%;width:23px;height:23px;padding:0;font-size:15px}.note-row.done .check{background:#58a85b;color:white;border-color:#58a85b}.note-row.done .note-input{opacity:.6;text-decoration:line-through}
dialog{border:0;border-radius:18px;width:min(94vw,520px);padding:18px;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0006}
label{display:block;font-size:13px;font-weight:700;margin-top:12px}.field{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}.dsel{border:1px solid #ccc;background:white;border-radius:8px;padding:8px 0}.dsel.on{background:#d9cbb8;border-color:#7c6a55}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.primary{background:#5f5142;color:#fff;border:0;border-radius:10px;padding:10px 16px}.secondary{background:#eee;border:0;border-radius:10px;padding:10px 16px}
.cats{display:flex;gap:6px;align-items:end}.cats select{flex:1}.tiny{padding:10px;border:0;border-radius:10px;background:#eee}
.hint{font-size:12px;color:#777;margin-top:6px}
@media(max-width:520px){.app{padding:9px}.calendar{gap:5px}.day{min-height:54px;padding:4px 2px}.event{font-size:11px}.dayhead{font-size:12px}.dow{width:30px}.month{font-size:18px}header{grid-template-columns:42px 1fr 42px 42px;gap:5px}}
</style>
</head>
<body>
<div class="app">
<header>
<button class="nav" id="prev">‹</button>
<button class="month" id="monthTitle"></button>
<button class="add" id="add">＋</button>
<button class="nav" id="next">›</button>
</header>
<main class="calendar" id="calendar"></main>
<section class="postit"><div class="postit-head"><h3 id="noteTitle">📝 APPUNTI</h3><div class="note-tools"><button class="note-tool" id="addNote" title="Aggiungi riga">＋</button><button class="note-tool" id="clearDone" title="Elimina completati">🗑️</button></div></div><div class="note-list" id="noteList"></div></section>
</div>

<dialog id="eventDlg">
<h2 style="margin-top:0">Nuovo appuntamento</h2>
<label>Titolo</label><input id="title" class="field" placeholder="es. Revisioni">
<div class="cats"><div style="flex:1"><label>Categoria</label><select id="cat" class="field"></select></div><button id="newCat" class="tiny">＋</button></div>
<label><input type="checkbox" id="hasTime"> Con orario</label>
<div class="row" id="timeRow" style="display:none"><div><label>Da</label><input type="time" id="start" class="field"></div><div><label>A (facoltativa)</label><input type="time" id="end" class="field"></div></div>
<label>Giorni del mese (selezionane anche più di uno)</label><div class="days" id="dayPicker"></div>
<div class="actions"><button class="secondary" id="cancel">Annulla</button><button class="primary" id="save">Salva</button></div>
</dialog>

<dialog id="monthDlg">
<h2>Scegli mese</h2><div class="row"><select id="mSel" class="field"></select><input id="ySel" type="number" class="field" min="1970" max="2100"></div>
<div class="actions"><button class="secondary" id="mCancel">Annulla</button><button class="primary" id="mOk">Vai</button></div>
</dialog>

<script>
const M=['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const D=['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
let view=new Date(); view=new Date(view.getFullYear(),view.getMonth(),1);
let db=JSON.parse(localStorage.getItem('myagenda-db')||'{"events":[],"categories":[{"name":"Lavoro","symbol":"💼"},{"name":"Allenamento","symbol":"🏋️"},{"name":"Casa","symbol":"🏠"},{"name":"Altro","symbol":"📌"}],"notes":{}}');
const $=id=>document.getElementById(id); const persist=()=>localStorage.setItem('myagenda-db',JSON.stringify(db));
function key(){return `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`}
function daysIn(){return new Date(view.getFullYear(),view.getMonth()+1,0).getDate()}
function render(){
 $('monthTitle').textContent=`${M[view.getMonth()]} ${view.getFullYear()}`; $('noteTitle').textContent=`📝 APPUNTI · ${M[view.getMonth()]}`;
 $('calendar').innerHTML='';
 let n=daysIn();
 for(let d=1;d<=n;d++){let date=new Date(view.getFullYear(),view.getMonth(),d);let box=document.createElement('div');box.className='day';
 if(date.getDay()===0)box.classList.add('sunday');let h=document.createElement('div');h.className='dayhead';h.innerHTML=`<span class="dow">${D[date.getDay()]}</span> ${d}`; box.append(h);
 let iso=`${key()}-${String(d).padStart(2,'0')}`;
 let ev=db.events.filter(e=>e.date===iso).sort((a,b)=>{if(!a.start&&!b.start)return a.created-b.created;if(!a.start)return -1;if(!b.start)return 1;return a.start.localeCompare(b.start)||a.created-b.created});
 ev.forEach(e=>{let c=db.categories[e.cat]||{symbol:'📌'};let p=document.createElement('div');p.className='event';
 let tm=e.start?`<span class="time">${e.start}${e.end?'–'+e.end:''}</span> `:'';p.innerHTML=`<span class="sym">${c.symbol}</span>${tm}${escapeHtml(e.title)}`;box.append(p)});
 box.onclick=()=>openEvent(d); $('calendar').append(box)}
 renderNotes();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fillCats(){ $('cat').innerHTML=db.categories.map((c,i)=>`<option value="${i}">${c.symbol} ${escapeHtml(c.name)}</option>`).join('')}
function buildDays(selected=[]){$('dayPicker').innerHTML='';for(let d=1;d<=daysIn();d++){let b=document.createElement('button');b.className='dsel'+(selected.includes(d)?' on':'');b.textContent=d;b.dataset.d=d;b.onclick=e=>{e.preventDefault();b.classList.toggle('on')};$('dayPicker').append(b)}}
function openEvent(day){fillCats();$('title').value='';$('hasTime').checked=false;$('timeRow').style.display='none';$('start').value='';$('end').value='';buildDays(day?[day]:[]);$('eventDlg').showModal()}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('add').onclick=()=>openEvent(); $('hasTime').onchange=()=> $('timeRow').style.display=$('hasTime').checked?'grid':'none';
$('cancel').onclick=()=>$('eventDlg').close();
$('save').onclick=()=>{let t=$('title').value.trim(), days=[...document.querySelectorAll('.dsel.on')].map(x=>+x.dataset.d);if(!t||!days.length){alert('Inserisci titolo e almeno un giorno.');return}
let gid=Date.now().toString(36), created=Date.now();days.forEach((d,i)=>db.events.push({id:gid+'-'+d,group:gid,date:`${key()}-${String(d).padStart(2,'0')}`,title:t,cat:+$('cat').value,start:$('hasTime').checked?$('start').value:'',end:$('hasTime').checked?$('end').value:'',created:created+i}));persist();$('eventDlg').close();render()};
$('newCat').onclick=()=>{let name=prompt('Nome categoria:');if(!name)return;let symbol=prompt('Simbolo / emoji:', '📌')||'📌';db.categories.push({name,symbol});persist();fillCats();$('cat').value=db.categories.length-1};
function getNotes(){let v=db.notes[key()];if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim())return v.split(/\n+/).filter(Boolean).map(text=>({text,done:false}));return []}
function renderNotes(){let list=$('noteList'), notes=getNotes();db.notes[key()]=notes;list.innerHTML='';let count=Math.max(3,notes.length);for(let i=0;i<count;i++){let item=notes[i]||{text:'',done:false};let row=document.createElement('div');row.className='note-row'+(item.done?' done':'');let bullet=document.createElement('span');bullet.className='bullet';bullet.textContent=item.text?'•':'';let input=document.createElement('input');input.className='note-input';input.placeholder=i===0&&!item.text?'Scrivi qui...':'';input.value=item.text||'';let check=document.createElement('button');check.className='check';check.textContent=item.done?'✓':'';check.style.visibility=item.text?'visible':'hidden';input.oninput=()=>{while(notes.length<=i)notes.push({text:'',done:false});notes[i].text=input.value;bullet.textContent=input.value?'•':'';check.style.visibility=input.value?'visible':'hidden';db.notes[key()]=notes;persist()};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();while(notes.length<=i)notes.push({text:'',done:false});notes.splice(i+1,0,{text:'',done:false});db.notes[key()]=notes;persist();renderNotes();setTimeout(()=>document.querySelectorAll('.note-input')[i+1]?.focus(),0)}};check.onclick=()=>{if(!input.value)return;while(notes.length<=i)notes.push({text:'',done:false});notes[i].done=!notes[i].done;db.notes[key()]=notes;persist();renderNotes()};row.append(bullet,input,check);list.append(row)}persist()}
$('addNote').onclick=()=>{let notes=getNotes();notes.push({text:'',done:false});db.notes[key()]=notes;persist();renderNotes();setTimeout(()=>document.querySelectorAll('.note-input')[notes.length-1]?.focus(),0)};
$('clearDone').onclick=()=>{let notes=getNotes().filter(n=>!n.done);db.notes[key()]=notes;persist();renderNotes()};
$('monthTitle').onclick=()=>{$('mSel').innerHTML=M.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('mSel').value=view.getMonth();$('ySel').value=view.getFullYear();$('monthDlg').showModal()};
$('mCancel').onclick=()=>$('monthDlg').close();$('mOk').onclick=()=>{view=new Date(+$('ySel').value,+$('mSel').value,1);$('monthDlg').close();render()};
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body></html>
